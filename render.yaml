services:
  - type: web
    name: mockpro-app
    env: node
    plan: free
    repo: https://github.com/Thamizh-01/Mock_interview.git
    branch: main
    buildCommand: npm run build-client && cd server && npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true
